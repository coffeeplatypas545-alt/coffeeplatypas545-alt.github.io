<div class="booking">
    <div class="booking__header">
        <h2 class="booking__title">Заполните форму<br>и мы подберем площадку</h2>
    </div>

    <form class="booking__form">
        <div class="booking__column">
            <fieldset class="booking__fieldset">
                <legend class="booking__legend">Формат мероприятия:</legend>
                <label class="booking__radio-label"><input type="radio" name="format" value="master-class"> Мастер-класс/семинар</label>
                <label class="booking__radio-label"><input type="radio" name="format" value="concert"> Концерт/выступление</label>
                <label class="booking__radio-label"><input type="radio" name="format" value="exhibition"> Выставка/показ</label>
                <label class="booking__radio-label"><input type="radio" name="format" value="other"> Другое</label>
            </fieldset>

            <fieldset class="booking__fieldset">
                <legend class="booking__legend">Контактные данные:</legend>
                <input type="text" placeholder="Имя*" class="booking__input">
                <input type="tel" placeholder="+7 (___) ___-__-__" class="booking__input">
            </fieldset>
        </div>

        <div class="booking__column">
            <fieldset class="booking__fieldset">
                <legend class="booking__legend">Планируемое количество посетителей:</legend>
                <select class="booking__select">
                    <option>до 20 человек</option>
                    <option>20-50 человек</option>
                    <option>более 50 человек</option>
                </select>
            </fieldset>

            <fieldset class="booking__fieldset">
                <legend class="booking__legend">Дата проведения:</legend>
                <input type="date" class="booking__input">
            </fieldset>
        </div>

        <fieldset class="booking__fieldset booking__fieldset--full">
            <legend class="booking__legend">Есть пожелания? Напишите нам:</legend>
            <textarea class="booking__textarea" rows="4"></textarea>
        </fieldset>

        <div class="booking__footer booking__footer--full">
            <label class="booking__checkbox-label">
                <input type="checkbox" checked>
                Я соглашаюсь с пользовательским соглашением и с политикой использования персональных данных
            </label>
            <div class="booking__actions">
                <button type="submit" class="btn btn--dark">Отправить</button>
                <button type="button" class="btn btn--clear">Закрыть</button>
            </div>
        </div>
    </form>
</div>
